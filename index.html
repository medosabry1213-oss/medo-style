
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيق النافذة المنسدلة للتفاصيل */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .detail-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
            border-radius: 8px;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }
        .product-details-text {
            color: #555;
            margin: 15px 0;
            line-height: 1.6;
            text-align: right;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="store-title">متجري الإلكتروني 🛒</h1>
        <div class="cart-badge" onclick="openCartModal()">
            🛒 السلة: <span id="cart-count">0</span> منتجات
        </div>
    </header>

    <section id="admin-panel" class="admin-panel" style="display: none;">
        <h3>➕ إضافة منتج جديد للمتجر</h3>
        <input type="text" id="new-name" placeholder="اسم المنتج">
        <input type="number" id="new-price" placeholder="السعر بالجنيه">
        <textarea id="new-details" placeholder="تفاصيل المنتج (اكتب كل ما يخص المنتج هنا)..." rows="3" style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;"></textarea>
        
        <div class="file-upload-wrapper">
            <label for="new-image">اختر صورة المنتج من جهازك:</label>
            <input type="file" id="new-image" accept="image/*">
        </div>

        <button onclick="addNewProduct()">إضافة المنتج للمتجر</button>
    </section>

    <main>
        <h2>قائمة المنتجات المتاحة</h2>
        <div class="products-grid" id="products-container"></div>
    </main>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2>سلة المشتريات</h2>
            <div id="cart-items-list"></div>
            <p class="total-price">الإجمالي الكلي: <span id="total-amount">0</span> جنيه</p>
            <button class="whatsapp-btn" onclick="checkoutWhatsApp()">إتمام الطلب عبر الواتساب 📱</button>
        </div>
    </div>

    <!-- نافذة تفاصيل المنتج -->
    <div id="product-detail-modal" class="modal">
        <div class="modal-content detail-content">
            <span class="close-btn" onclick="closeProductDetail()">&times;</span>
            <img id="detail-image" src="" alt="تفاصيل المنتج">
            <h2 id="detail-name"></h2>
            <p id="detail-price" class="price"></p>
            <p id="detail-description" class="product-details-text"></p>
            <button id="add-to-cart-detail-btn" onclick="">إضافة للسلة</button>
        </div>
    </div>

    <!-- كود إعدادات Firebase وربط قاعدة البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC0u38UFwPh9Xep8wi-lSu1fDfl2I943U8",
            authDomain: "matger-79f62.firebaseapp.com",
            projectId: "matger-79f62",
            storageBucket: "matger-79f62.firebasestorage.app",
            messagingSenderId: "480027238694",
            appId: "1:480027238694:web:8764db77e5c03e043361e7",
            measurementId: "G-BXRCK4B4CK"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        window.products = [];
        // استرجاع السلة المحفوظة من localStorage إن وجدت
        window.cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
        updateCartCount();

        let pressTimer;
        const storeTitle = document.getElementById('store-title');

        storeTitle.addEventListener('mousedown', startPress);
        storeTitle.addEventListener('mouseup', cancelPress);
        storeTitle.addEventListener('mouseleave', cancelPress);
        storeTitle.addEventListener('touchstart', startPress);
        storeTitle.addEventListener('touchend', cancelPress);
        storeTitle.addEventListener('touchcancel', cancelPress);

        let isAdminLoggedIn = false;

        function startPress() {
            pressTimer = setTimeout(() => {
                const password = prompt("برجاء إدخال كلمة المرور:");
                if (password === "8888") {
                    isAdminLoggedIn = true;
                    document.getElementById('admin-panel').style.display = 'block';
                    window.renderProducts();
                } else {
                    alert("كلمة المرور غير صحيحة!");
                }
            }, 5000);
        }

        function cancelPress() {
            clearTimeout(pressTimer);
        }

        window.renderProducts = function() {
            let container = document.getElementById('products-container');
            container.innerHTML = '';
            
            if (window.products.length === 0) {
                container.innerHTML = '<p style="text-align: center; width: 100%;">لا توجد منتجات حالياً. أضف منتجات جديدة من لوحة التحكم.</p>';
                return;
            }

            window.products.forEach((product) => {
                let adminDeleteBtn = isAdminLoggedIn ? `<button onclick="deleteProductFromFirestore('${product.id}')" style="background: red; color: white; border: none; padding: 5px; margin-top: 5px; cursor: pointer; width: 100%;">حذف</button>` : '';

                container.innerHTML += `
                    <div class="product-card">
                        <img src="${product.image}" alt="${product.name}" onclick="openProductDetail('${product.name}', ${product.price}, '${product.image}', '${encodeURIComponent(product.details || 'لا توجد تفاصيل متاحة.')}')" style="cursor: pointer;">
                        <h3>${product.name}</h3>
                        <p class="price">${product.price} جنيه</p>
                        <button onclick="addToCart('${product.name}', ${product.price})">إضافة للسلة</button>
                        ${adminDeleteBtn}
                    </div>
                `;
            });
        }

        window.deleteProductFromFirestore = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    window.products = window.products.filter(p => p.id !== id);
                    window.renderProducts();
                    alert("تم حذف المنتج بنجاح!");
                } catch (error) {
                    console.error("خطأ في الحذف: ", error);
                    alert("حدث خطأ أثناء الحذف.");
                }
            }
        }

        window.openProductDetail = function(name, price, image, details) {
            document.getElementById('detail-image').src = image;
            document.getElementById('detail-name').innerText = name;
            document.getElementById('detail-price').innerText = price + " جنيه";
            document.getElementById('detail-description').innerText = decodeURIComponent(details);
            
            const cartBtn = document.getElementById('add-to-cart-detail-btn');
            cartBtn.onclick = function() { addToCart(name, price); };

            document.getElementById('product-detail-modal').style.display = 'flex';
        }

        window.closeProductDetail = function() {
            document.getElementById('product-detail-modal').style.display = 'none';
        }

        window.addNewProduct = async function() {
            let name = document.getElementById('new-name').value;
            let price = Number(document.getElementById('new-price').value);
            let details = document.getElementById('new-details').value;
            let imageInput = document.getElementById('new-image');

            if (!name || !price || imageInput.files.length === 0) {
                alert('من فضلك املأ اسم المنتج، السعر، واستر صوره على الأقل!');
                return;
            }

            let reader = new FileReader();
            reader.onload = async function(e) {
                let imageSrc = e.target.result;
                let newProd = { name: name, price: price, details: details, image: imageSrc, createdAt: new Date() };
                
                try {
                    const docRef = await addDoc(collection(db, "products"), newProd);
                    newProd.id = docRef.id;
                    window.products.push(newProd);
                    window.renderProducts();

                    document.getElementById('new-name').value = '';
                    document.getElementById('new-price').value = '';
                    document.getElementById('new-details').value = '';
                    imageInput.value = '';
                    alert('تمت إضافة المنتج بنجاح وحفظه في قاعدة البيانات!');
                } catch (error) {
                    console.error("خطأ أثناء حفظ المنتج: ", error);
                    alert("حدث خطأ أثناء حفظ المنتج في قاعدة البيانات.");
                }
            };
            reader.readAsDataURL(imageInput.files[0]);
        }

        window.addToCart = function(name, price) {
            window.cartItems.push({ name: name, price: price });
            localStorage.setItem('cartItems', JSON.stringify(window.cartItems));
            updateCartCount();
            alert('تمت إضافة ' + name + ' إلى السلة!');
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = window.cartItems.length;
        }

        window.openCartModal = function() {
            let listContainer = document.getElementById('cart-items-list');
            listContainer.innerHTML = '';
            let total = 0;

            if (window.cartItems.length === 0) {
                listContainer.innerHTML = '<p>السلة فارغة حالياً.</p>';
            } else {
                window.cartItems.forEach((item, index) => {
                    total += item.price;
                    listContainer.innerHTML += `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                            <span>${index + 1}. ${item.name} - ${item.price} جنيه</span>
                            <button onclick="removeFromCart(${index})" style="background: red; color: white; border: none; padding: 2px 5px; cursor: pointer;">حذف</button>
                        </div>
                    `;
                });
            }

            document.getElementById('total-amount').innerText = total;
            document.getElementById('cart-modal').style.display = 'flex';
        }

        window.removeFromCart = function(index) {
            window.cartItems.splice(index, 1);
            localStorage.setItem('cartItems', JSON.stringify(window.cartItems));
            updateCartCount();
            window.openCartModal();
        }

        window.closeCartModal = function() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        window.checkoutWhatsApp = function() {
            if (window.cartItems.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            let phone = "+201097281524"; 
            let message = "مرحباً، أريد طلب المنتجات التالية:%0A";
            let total = 0;

            window.cartItems.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.price} جنيه%0A`;
                total += item.price;
            });

            message += `%0Aالإجمالي الكلي: ${total} جنيه`;
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }

        async function loadProductsFromFirestore() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                window.products = [];
                querySnapshot.forEach((doc) => {
                    let prodData = doc.data();
                    prodData.id = doc.id;
                    window.products.push(prodData);
                });
                window.renderProducts();
            } catch (e) {
                console.error("خطأ في جلب المنتجات من قاعدة البيانات: ", e);
            }
        }

        loadProductsFromFirestore();
    </script>
</body>
</html>

```
