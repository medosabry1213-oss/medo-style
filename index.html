
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✬ 🦅𝒔𝒐𝒌𝒂𝒓🦅 ✬</title>
    <!-- استدعاء مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-attachment: fixed;
            color: #fff;
            padding-bottom: 30px;
            min-height: 100vh;
        }

        /* هيدر زجاجي متطور مع أيقونات السوشيال ميديا */
        header {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            gap: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            user-select: none;
        }

        /* أزرار السوشيال ميديا الشفافة */
        .social-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .social-icon:active {
            transform: scale(0.85);
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .social-icon.tiktok:active { color: #ff0050; border-color: #ff0050; }
        .social-icon.facebook:active { color: #1877f2; border-color: #1877f2; }
        .social-icon.whatsapp:active { color: #25d366; border-color: #25d366; }

        /* زر السلة الزجاجي */
        .cart-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .cart-badge:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* شريط الأقسام */
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .category-btn {
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #e0e0e0;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .category-btn.active, .category-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        main {
            padding: 0 15px;
        }

        main h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #e0e0e0;
            font-weight: 500;
        }

        /* كروت المنتجات الزجاجية */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .product-number {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }

        .product-category-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 9px;
            z-index: 2;
        }

        .product-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .product-card h3 {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-card .price {
            font-size: 1rem;
            color: #4facfe;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(79, 172, 254, 0.4);
        }

        /* أزرار زجاجية عامة */
        .glass-btn {
            width: 100%;
            padding: 9px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .glass-btn-green {
            background: rgba(40, 167, 69, 0.3);
            border-color: rgba(40, 167, 69, 0.5);
        }

        .glass-btn-green:active {
            transform: scale(0.92);
            background: rgba(40, 167, 69, 0.5);
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.6);
        }

        .glass-btn-red {
            background: rgba(220, 53, 69, 0.3);
            border-color: rgba(220, 53, 69, 0.5);
        }

        .glass-btn-red:active {
            transform: scale(0.92);
            background: rgba(220, 53, 69, 0.5);
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.6);
        }

        .out-of-stock-badge {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
            margin: 6px 0;
        }

        /* سلايدر صور التفاصيل */
        .gallery-container {
            position: relative;
            width: 100%;
            margin-bottom: 12px;
        }

        .gallery-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .gallery-nav-btn:active {
            transform: translateY(-50%) scale(0.85);
            background: rgba(255, 255, 255, 0.4);
        }

        .gallery-nav-btn.prev { right: 8px; }
        .gallery-nav-btn.next { left: 8px; }

        .gallery-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #4facfe;
            width: 18px;
            border-radius: 10px;
        }

        /* نافذة العرض الكامل للصورة (Full Screen Viewer) */
        .fullscreen-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
        }

        .fullscreen-modal img {
            max-width: 95%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .fullscreen-close {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 32px;
            color: #fff;
            cursor: pointer;
            z-index: 2001;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* لوحة التحكم */
        .admin-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin: 15px;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .admin-panel h3 {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: #fff;
        }

        .admin-panel input, .admin-panel select, .admin-panel textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .admin-panel input::placeholder, .admin-panel textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .admin-panel option {
            background: #203a43;
            color: #fff;
        }

        /* النوافذ المنسدلة (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            justify-content: center;
            align-items: flex-end;
        }

        .modal-content {
            background: rgba(25, 35, 45, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            color: #fff;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 12px;
            left: 18px;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
        }

        .detail-content img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .product-details-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            margin: 12px 0;
            line-height: 1.5;
            text-align: right;
        }

        .checkout-inputs input {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .checkout-inputs input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .whatsapp-btn {
            width: 100%;
            padding: 12px;
            background: rgba(37, 211, 102, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(37, 211, 102, 0.5);
            color: #fff;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .whatsapp-btn:active {
            transform: scale(0.92);
            background: rgba(37, 211, 102, 0.4);
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.5);
        }

        /* كارت المنتج المنسق داخل السلة */
        .cart-item-card {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 10px;
            border-radius: 12px;
        }

        .cart-item-img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
        }

        .cart-item-details {
            flex-grow: 1;
            font-size: 0.8rem;
        }

        .cart-category-badge {
            display: inline-block;
            font-size: 0.7rem;
            color: #4facfe;
            background: rgba(79, 172, 254, 0.15);
            padding: 1px 6px;
            border-radius: 6px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <section id="admin-panel" class="admin-panel" style="display: none;">
        <h3>➕ إضافة منتج جديد</h3>

    <main>
        <!-- أزرار التصفية الشفافة -->
        <div class="category-filter">

        <h2>المنتجات المتاحة</h2>

    </main>

    <!-- نافذة السلة الشفافة -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2 style="font-size: 1.1rem; margin-bottom: 15px; text-align: center;">سلة المشتريات 🛒</h2>
            <div id="cart-items-list"></div>
            <p style="font-weight: bold; margin: 15px 0; text-align: center; font-size: 1rem; color: #4facfe;">الإجمالي الكلي: <span id="total-amount">0</span> جنيه</p>
            
            <div class="checkout-inputs">
                <input type="text" id="customer-name" placeholder="الاسم بالكامل">
                <input type="text" id="customer-phone" placeholder="رقم الهاتف للتواصل">
                <input type="text" id="customer-location" placeholder="العنوان التفصيلي">

            <button class="whatsapp-btn" onclick="checkoutWhatsApp()">تأكيد الطلب عبر WhatsApp 📱</button>

    </div>

    <!-- نافذة تفاصيل المنتج الشفافة مع سلايدر الصور -->
    <div id="product-detail-modal" class="modal">
        <div class="modal-content detail-content">
            <span class="close-btn" onclick="closeProductDetail()">&times;</span>
            
            <div class="gallery-container">

                <img id="detail-image" src="" alt="تفاصيل المنتج" onclick="openFullscreen(this.src)">
                <button class="gallery-nav-btn next" onclick="changeDetailImage(1)">&lt;</button>
                <div class="gallery-dots" id="detail-dots"></div>
            </div>

            <h2 id="detail-name" style="font-size: 1rem;"></h2>
            <p id="detail-price" style="font-size: 1.1rem; color: #4facfe; font-weight: bold; margin: 5px 0;"></p>
            <p id="detail-description" class="product-details-text"></p>
            <button id="add-to-cart-detail-btn" class="glass-btn glass-btn-green" style="padding: 12px; font-size: 0.9rem;">إضافة للسلة 🛒</button>
        </div>

    <!-- نافذة عرض الصورة ملء الشاشة -->
    <div id="fullscreen-modal" class="fullscreen-modal">
        <span class="fullscreen-close" onclick="closeFullscreen()">&times;</span>
        <img id="fullscreen-image" src="" alt="معاينة كاملة">
    </div>

    <!-- كود Firebase و الجافا سكريبت -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC0u38UFwPh9Xep8wi-lSu1fDfl2I943U8",
            authDomain: "matger-79f62.firebaseapp.com",
            projectId: "matger-79f62",
            storageBucket: "matger-79f62.firebasestorage.app",
            messagingSenderId: "480027238694",
            appId: "1:480027238694:web:8764db77e5c03e043361e7",
            measurementId: "G-BXRCK4B4CK"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        window.products = [];
        window.currentCategoryFilter = 'all';
        window.cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
        window.currentDetailImages = [];
        window.currentImageIndex = 0;
        updateCartCount();

        let pressTimer;
        const storeTitle = document.getElementById('store-title');

        storeTitle.addEventListener('mousedown', startPress);
        storeTitle.addEventListener('mouseup', cancelPress);
        storeTitle.addEventListener('mouseleave', cancelPress);
        storeTitle.addEventListener('touchstart', startPress);
        storeTitle.addEventListener('touchend', cancelPress);
        storeTitle.addEventListener('touchcancel', cancelPress);

        function startPress() {
            pressTimer = setTimeout(() => {
                const password = prompt("برجاء إدخال كلمة المرور:");
                if (password === "132901") {
                    document.getElementById('admin-panel').style.display = 'block';
                    window.renderProducts();
                } else if(password !== null) {
                    alert("كلمة المرور غير صحيحة!");
                }
            }, 5000);
        }

        function cancelPress() {
            clearTimeout(pressTimer);
        }

        window.filterCategory = function(category, element) {
            window.currentCategoryFilter = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            window.renderProducts();
        };

        window.renderProducts = function() {
            let container = document.getElementById('products-container');
            container.innerHTML = '';
            
            let filteredProducts = window.products.filter(p => {
                if (window.currentCategoryFilter === 'all') return true;
                return p.category === window.currentCategoryFilter;
            });

            if (filteredProducts.length === 0) {
                container.innerHTML = '<p style="text-align: center; width: 100%; color: rgba(255,255,255,0.6); grid-column: 1/-1; padding: 20px;">لا توجد منتجات متوفرة حالياً.</p>';
                return;
            }

            let isAdminOpen = document.getElementById('admin-panel').style.display === 'block';

            filteredProducts.forEach((product, index) => {
                let productNum = index + 1;
                let isOut = product.outOfStock ? true : false;
                let categoryLabel = product.category === 'women' ? 'حريمي 👩' : 'رجالي 👨';
                let mainImage = (product.images && product.images.length > 0) ? product.images[0] : (product.image || '');
                
                let adminControlsHtml = '';
                if (isAdminOpen) {
                    let stockButtonText = isOut ? "إعادة توفر" : "غير متوفر";
                    let stockButtonClass = isOut ? "glass-btn-green" : "glass-btn";
                    
                    adminControlsHtml = `
                        <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 5px;">
                            <button class="glass-btn ${stockButtonClass}" onclick="toggleStock('${product.id}', ${!isOut})" style="padding: 4px; font-size: 0.7rem;">${stockButtonText}</button>
                            <button class="glass-btn glass-btn-red" onclick="deleteProduct('${product.id}')" style="padding: 4px; font-size: 0.7rem;">حذف</button>
                        </div>
                    `;
                }

                let stockStatusHtml = isOut ? `<p class="out-of-stock-badge">غير متوفر</p>` : `<button class="glass-btn glass-btn-green" onclick="addToCart('${product.id}', '${product.name}', ${product.price}, ${productNum}, '${product.category}')">إضافة للسلة</button>`;

                container.innerHTML += `
                    <div class="product-card">
                        <span class="product-category-badge">${categoryLabel}</span>
                        <img src="${mainImage}" alt="${product.name}" onclick="openProductDetail('${product.id}', ${productNum})" style="cursor: pointer; ${isOut ? 'opacity: 0.4;' : ''}">
                        <div class="product-number">رقم المنتج: #${productNum}</div>
                        <h3>${product.name}</h3>
                        <p class="price">${product.price} ج.م</p>
                        ${stockStatusHtml}
                        ${adminControlsHtml}
                    </div>
                `;
            });
        }

        window.openProductDetail = function(id, productNum) {
            let product = window.products.find(p => p.id === id);
            if (!product) return;

            if (product.outOfStock) {
                alert("عذراً، هذا المنتج غير متوفر حالياً.");
                return;
            }

            window.currentDetailImages = (product.images && product.images.length > 0) ? product.images : [product.image];
            window.currentImageIndex = 0;

            updateDetailGallery();

            document.getElementById('detail-name').innerText = product.name;
            document.getElementById('detail-price').innerText = product.price + " جنيه";
            document.getElementById('detail-description').innerText = product.details || 'لا توجد تفاصيل متاحة.';
            
            const cartBtn = document.getElementById('add-to-cart-detail-btn');
            cartBtn.onclick = function() { addToCart(product.id, product.name, product.price, productNum, product.category); };

            document.getElementById('product-detail-modal').style.display = 'flex';
        }

        function updateDetailGallery() {
            let imgElem = document.getElementById('detail-image');
            imgElem.src = window.currentDetailImages[window.currentImageIndex];

            let dotsContainer = document.getElementById('detail-dots');
            dotsContainer.innerHTML = '';
            
            if(window.currentDetailImages.length > 1) {
                window.currentDetailImages.forEach((_, idx) => {
                    dotsContainer.innerHTML += `<div class="dot ${idx === window.currentImageIndex ? 'active' : ''}"></div>`;
                });
            }
        }

        window.changeDetailImage = function(direction) {
            if(window.currentDetailImages.length <= 1) return;
            window.currentImageIndex += direction;
            if(window.currentImageIndex < 0) window.currentImageIndex = window.currentDetailImages.length - 1;
            if(window.currentImageIndex >= window.currentDetailImages.length) window.currentImageIndex = 0;
            updateDetailGallery();
        }

        window.openFullscreen = function(src) {
            if(!src) return;
            document.getElementById('fullscreen-image').src = src;
            document.getElementById('fullscreen-modal').style.display = 'flex';
        }

        window.closeFullscreen = function() {
            document.getElementById('fullscreen-modal').style.display = 'none';
        }

        window.closeProductDetail = function() {
            document.getElementById('product-detail-modal').style.display = 'none';
        }

        window.addNewProduct = async function() {
            let name = document.getElementById('new-name').value.trim();
            let price = Number(document.getElementById('new-price').value);
            let category = document.getElementById('new-category').value;
            let details = document.getElementById('new-details').value;
            let imageInput = document.getElementById('new-image');

            if (!name || !price || imageInput.files.length === 0) {
                alert('من فضلك املأ اسم المنتج، السعر، واختر صورة واحدة على الأقل!');
                return;
            }

            let imagesArray = [];
            let files = Array.from(imageInput.files);

            let promises = files.map(file => {
                return new Promise((resolve) => {
                    let reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            });

            imagesArray = await Promise.all(promises);

            let newProd = { 
                name: name, 
                price: price, 
                category: category, 
                details: details, 
                images: imagesArray, 
                image: imagesArray[0], 
                outOfStock: false, 
                createdAt: new Date() 
            };
            
            try {
                const docRef = await addDoc(collection(db, "products"), newProd);
                newProd.id = docRef.id;
                window.products.push(newProd);
                window.renderProducts();

                document.getElementById('new-name').value = '';
                document.getElementById('new-price').value = '';
                document.getElementById('new-details').value = '';
                imageInput.value = '';
                alert('تم إضافة المنتج بنجاح مع صوره!');
            } catch (error) {
                console.error("خطأ أثناء الحفظ: ", error);
                alert("حدث خطأ أثناء حفظ المنتج.");
            }
        }

        window.deleteProduct = async function(id) {
            if (!confirm("هل أنت متأكد من حذف هذا المنتج نهائياً؟")) return;
            try {
                await deleteDoc(doc(db, "products", id));
                window.products = window.products.filter(p => p.id !== id);
                window.renderProducts();
                alert("تم حذف المنتج بنجاح!");
            } catch (error) {
                console.error("خطأ أثناء الحذف: ", error);
                alert("حدث خطأ أثناء الحذف: " + error.message);
            }
        }

        window.toggleStock = async function(id, status) {
            try {
                const productRef = doc(db, "products", id);
                await updateDoc(productRef, { outOfStock: status });
                let product = window.products.find(p => p.id === id);
                if (product) {
                    product.outOfStock = status;
                }
                window.renderProducts();
            } catch (error) {
                console.error("خطأ في تحديث الحالة: ", error);
                alert("حدث خطأ أثناء التحديث.");
            }
        }

        window.addToCart = function(id, name, price, productNum, category) {
            let product = window.products.find(p => p.id === id);
            if (product && product.outOfStock) {
                alert("عذراً، هذا المنتج غير متوفر حالياً.");
                return;
            }

            let mainImage = (product && product.images && product.images.length > 0) ? product.images[0] : (product ? product.image : '');

            let existingItem = window.cartItems.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                window.cartItems.push({ 
                    id: id, 
                    name: name, 
                    price: price, 
                    productNum: productNum, 
                    quantity: 1, 
                    image: mainImage,
                    category: category || 'men'
                });
            }
            localStorage.setItem('cartItems', JSON.stringify(window.cartItems));
            updateCartCount();
            alert('تمت إضافة ' + name + ' إلى السلة!');
        }

        function updateCartCount() {
            let totalQty = 0;
            window.cartItems.forEach(item => totalQty += item.quantity);
            document.getElementById('cart-count').innerText = totalQty;
        }

        window.openCartModal = function() {
            let listContainer = document.getElementById('cart-items-list');
            listContainer.innerHTML = '';
            let total = 0;

            if (window.cartItems.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6);">السلة فارغة حالياً.</p>';
            } else {
                window.cartItems.forEach((item, index) => {
                    total += (item.price * item.quantity);
                    let categoryLabel = item.category === 'women' ? 'حريمي 👩' : 'رجالي 👨';
                    listContainer.innerHTML += `
                        <div class="cart-item-card">
                            <img src="${item.image}" class="cart-item-img" onclick="openFullscreen('${item.image}')" alt="${item.name}">
                            <div class="cart-item-details">
                                <span class="cart-category-badge">${categoryLabel}</span><br>
                                <strong>${item.name}</strong> (#${item.productNum})<br>
                                <span style="color: rgba(255,255,255,0.7);">${item.price} ج × ${item.quantity}</span>
                            </div>
                            <button class="glass-btn glass-btn-red" onclick="removeFromCart(${index})" style="padding: 6px 10px; width: auto; font-size: 0.75rem;">حذف</button>
                        </div>
                    `;
                });
            }

            document.getElementById('total-amount').innerText = total;
            document.getElementById('cart-modal').style.display = 'flex';
        }

        window.removeFromCart = function(index) {
            window.cartItems.splice(index, 1);
            localStorage.setItem('cartItems', JSON.stringify(window.cartItems));
            updateCartCount();
            window.openCartModal();
        }

        window.closeCartModal = function() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        window.checkoutWhatsApp = function() {
            if (window.cartItems.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            let customerName = document.getElementById('customer-name').value.trim();
            let customerPhone = document.getElementById('customer-phone').value.trim();
            let customerLocation = document.getElementById('customer-location').value.trim();

            if (!customerName || !customerPhone || !customerLocation) {
                alert('من فضلك املأ جميع البيانات (الاسم، الهاتف، العنوان)!');
                return;
            }

            let phone = "+201097281524"; 
            let message = `بيانات العميل:%0Aالاسم: ${customerName}%0Aرقم التواصل: ${customerPhone}%0Aالمكان: ${customerLocation}%0A%0Aالطلبات:%0A`;
            let total = 0;

            window.cartItems.forEach((item, index) => {
                let categoryLabel = item.category === 'women' ? 'حريمي' : 'رجالي';
                message += `${index + 1}. ${item.name} (#${item.productNum}) - [${categoryLabel}] - ${item.price} ج (العدد: ${item.quantity})%0A`;
                total += (item.price * item.quantity);
            });

            message += `%0Aالإجمالي الكلي: ${total} جنيه`;
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }

        async function loadProductsFromFirestore() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                window.products = [];
                querySnapshot.forEach((doc) => {
                    let prodData = doc.data();
                    prodData.id = doc.id;
                    if (!prodData.category) prodData.category = 'men';
                    window.products.push(prodData);
                });
                window.renderProducts();
            } catch (e) {
                console.error("خطأ في جلب البيانات: ", e);
            }
        }

        loadProductsFromFirestore();
    </script>
</body>
